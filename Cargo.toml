[package]
name = "field-core"
version = "0.1.0"
edition = "2021"
description = "Continuous constraint field library with topology detection and propagation"
repository = "https://github.com/SuperInstance/field-core"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
delaunator = "1.0"
